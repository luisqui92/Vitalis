<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03101a">
<title>Symphomed — Mapa de servicios médicos</title>
<meta name="description" content="Consultorios, laboratorios y farmacias en el mapa. Buscá por especialidad y reservá tu ficha.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
@font-face{font-family:"InterVar";src:url("/fonts/inter-variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --fondo:#03101a; --panel:#071a25; --panel2:#0c2a3a;
  --linea:#214354; --linea2:#2c6b84;
  --tinta:#fff; --tinta2:#a8bdc9; --tinta3:#7f97a6;
  --cian:#19b9ef; --cian2:#5bddfa;
  --consultorio:#19b9ef; --laboratorio:#7BB98A; --farmacia:#D8A64B; --imagenes:#B98AD3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--fondo);color:var(--tinta);
  font-family:InterVar,Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}

/* ── Barra ────────────────────────────────────────────────────────── */
.barra{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 20px;border-bottom:1px solid var(--linea);flex-wrap:wrap;
  background:var(--fondo);
}
.marca{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:2.5px;font-size:13px}
.marca i{width:7px;height:7px;border-radius:50%;background:var(--cian);display:block}
.volver{color:var(--tinta2);font-size:13px}
.volver:hover{color:var(--tinta)}

/* ── Aviso de demostración ────────────────────────────────────────── */
/* Va arriba de todo y no en letra chica: quien mire esta pantalla tiene que
   saber en el primer segundo que los consultorios son de ejemplo. */
.aviso{
  background:#1d2a12;border-bottom:1px solid #3c5220;color:#d8e8bd;
  padding:10px 20px;font-size:13px;display:flex;gap:10px;align-items:baseline;
}
.aviso b{color:#eaf6d8}

/* ── Buscador ─────────────────────────────────────────────────────── */
.buscador{padding:16px 20px;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:12px}
.campo{position:relative;display:flex}
.campo input{
  width:100%;background:var(--panel);border:1px solid var(--linea2);border-radius:999px;
  padding:13px 20px;color:var(--tinta);font:inherit;font-size:15px;
}
.campo input::placeholder{color:var(--tinta3)}
.campo input:focus{outline:2px solid var(--cian);outline-offset:1px;border-color:var(--cian)}
.controles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtro{
  background:transparent;border:1px solid var(--linea2);border-radius:999px;
  padding:7px 15px;color:var(--tinta2);font:inherit;font-size:12.5px;cursor:pointer;transition:.18s;
}
.filtro:hover{color:var(--tinta);border-color:var(--cian)}
.filtro[aria-pressed="true"]{background:var(--cian);border-color:var(--cian);color:#03131d;font-weight:600}
.filtro:focus-visible{outline:2px solid var(--cian2);outline-offset:2px}

/* ── El cuerpo: lista + mapa ──────────────────────────────────────── */
.cuerpo{flex:1;display:grid;grid-template-columns:minmax(320px,400px) 1fr;min-height:0}
.lista{overflow-y:auto;border-right:1px solid var(--linea);padding:8px 0}
.cuenta{padding:8px 20px 12px;color:var(--tinta3);font-size:12.5px}
/* La tarjeta ya no es un botón: es un contenedor con el cuerpo clicable
   adentro y las acciones aparte. El resaltado se queda en la tarjeta —que es
   lo que se selecciona— y el foco visible en el cuerpo, que es lo que recibe
   el teclado. */
.ficha{border-top:1px solid var(--linea);transition:background-color .16s}
.ficha:hover,.ficha[aria-current="true"]{background:var(--panel)}
.ficha-cuerpo{
  display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:start;
  width:100%;text-align:left;background:transparent;border:0;
  padding:16px 20px 10px;color:var(--tinta);font:inherit;cursor:pointer;
}
.ficha-cuerpo:focus-visible{outline:2px solid var(--cian);outline-offset:-2px}
/* Alineadas con la columna del texto (46 del avatar + 14 del hueco + 20 del
   margen), no con el borde: si arrancaran del borde parecerían de la tarjeta
   de arriba. */
.acciones{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 16px 80px}
.accion{
  display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  border:1px solid var(--linea2);border-radius:999px;padding:7px 14px;
  font-size:12.5px;color:var(--tinta2);transition:border-color .15s,color .15s;
}
.accion:hover{border-color:var(--cian);color:var(--cian2)}
.accion:focus-visible{outline:2px solid var(--cian);outline-offset:2px}
@media(max-width:560px){.acciones{padding-left:20px}}

/* Abierto/cerrado y distancia. Van arriba, pegados a la especialidad, porque
   son lo que decide si la tarjeta sirve: un domingo a la noche el 90% de la
   lista está cerrada y sin esto no hay forma de saber cuál. */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{
  border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;
  border:1px solid transparent;
}
.chip.abre{background:rgba(123,185,138,.14);border-color:#3f6b4c;color:#a9dcb8}
.chip.cierra{background:rgba(216,166,75,.10);border-color:#6b5730;color:#d8bb84}
.chip.dist{background:rgba(25,185,239,.10);border-color:#20556b;color:var(--cian2)}

/* No es un filtro: ORDENA. Por eso está al lado de los filtros y no adentro,
   y por eso no se ve como uno de ellos hasta que se activa. */
.cerca{
  background:transparent;border:1px dashed var(--linea2);border-radius:999px;
  padding:7px 15px;font:inherit;font-size:12.5px;color:var(--tinta2);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.cerca:hover:not(:disabled){border-color:var(--cian);color:var(--cian2)}
.cerca:disabled{opacity:.55;cursor:default}
.cerca[aria-pressed="true"]{border-style:solid;border-color:var(--cian);color:var(--cian2)}
.cerca:focus-visible{outline:2px solid var(--cian);outline-offset:2px}
/* En vez de una foto de una persona que no existe, la inicial sobre el color
   de su categoría. Cuando haya médicos de verdad, acá va su foto. */
.avatar{
  width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-weight:700;font-size:17px;color:#03131d;
}
/* ═══ LA DESCRIPCIÓN ES LO QUE SE LEE, NO UN PIE DE FOTO ══════════════════
   Estaba en 13px sobre un color atenuado. En una pantalla de escritorio se
   perdona; en un celular, que es desde donde va a entrar casi todo el mundo,
   la reseña —que es LA razón por la que alguien elige un consultorio y no el
   de al lado— quedaba más chica que los chips de horario.

   Ahora la reseña sube a 14.5px y en celular a 15px, que es el mismo tamaño
   que el nombre: deja de leerse como una aclaración al pie y pasa a ser el
   cuerpo de la tarjeta. El resto de la jerarquía se acomoda alrededor. */
.ficha h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.esp{color:var(--cian2);font-size:13px;margin-top:3px}
.resena{color:var(--tinta);font-size:14.5px;margin:9px 0 0;line-height:1.6}
.dir{color:var(--tinta2);font-size:12.5px;margin-top:8px}
.subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sub{border:1px solid var(--linea2);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--tinta2)}
.reservar{
  display:inline-block;margin-top:11px;background:var(--cian);color:#03131d;
  border:0;border-radius:999px;padding:8px 16px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
}
.reservar:hover{filter:brightness(1.08)}
.ejemplo{
  display:inline-block;margin-left:8px;border:1px solid #5c7a2e;color:#b9d68a;
  border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:600;vertical-align:middle;
}
.vacio{padding:40px 20px;color:var(--tinta3);text-align:center;font-size:14px}

#mapa{height:100%;width:100%;background:var(--panel)}
.leaflet-container{background:#0a1a24}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--tinta);border-radius:12px}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5}
.leaflet-popup-content b{display:block;font-size:14px;margin-bottom:3px}
.leaflet-popup-content em{font-style:normal;color:var(--cian2);font-size:12px}
.leaflet-control-attribution{background:rgba(3,16,26,.8)!important;color:#7f97a6!important}
.leaflet-control-attribution a{color:#a8bdc9!important}
/* ═══ EL CONTORNO NO ES ADORNO ════════════════════════════════════════════
   El borde era oscuro y semitransparente, que funcionaba sobre un mapa casi
   negro. Sobre un mapa de calles azules la chincheta de Consultorios —que es
   cian, y es la categoría que más importa— quedaba compitiendo con las
   avenidas y se perdía justo la que hay que ver.

   Un aro claro y opaco la despega de CUALQUIER fondo: azul, gris, agua o
   parque. Y deja de depender del estilo de mapa que esté configurado, que
   es una variable del .env y puede cambiar sin que nadie mire esto. */
.chincheta{
  width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  border:2px solid rgba(233,246,252,.92);
  box-shadow:0 2px 4px rgba(3,16,26,.9), 0 4px 12px rgba(0,0,0,.55);
}
.chincheta.activa{outline:3px solid var(--cian2);outline-offset:2px}

@media(max-width:860px){
  /* ═══ EL REPARTO VERTICAL ═══════════════════════════════════════════════
     Medido en un teléfono real (390×747 útiles, que es lo que le queda a
     Chrome en Android después de la barra de estado y la de direcciones):

       barra 49 + aviso 41 + buscador 216 + mapa 344 = 650
       → a la lista le quedaban 99 px, para una tarjeta de 301.

     O sea: se veía un tercio de una tarjeta, y nunca la parte de arriba. El
     nombre del consultorio —lo único que identifica lo que estás mirando—
     quedaba SIEMPRE tapado por el mapa.

     De los 216 del buscador, 120 eran los filtros envueltos en tres
     renglones. En una sola fila que se desliza de costado son 40, y esos 80
     px van enteros a la lista. El mapa baja de 46vh a 38vh y el aviso se
     achica un poco. La lista pasa de 99 a ~250: entra el encabezado entero
     de una tarjeta más su descripción.

     El minmax es la salvaguarda: si la pantalla es más baja todavía, lo que
     cede es el mapa y no la lista. Un mapa de 150 px sigue sirviendo; una
     lista de 99 no. */
  .cuerpo{grid-template-columns:1fr;grid-template-rows:minmax(0,38vh) minmax(230px,1fr)}
  .lista{border-right:0;border-top:1px solid var(--linea);order:2}
  .mapa-caja{order:1;min-height:0}

  .aviso{padding:8px 16px;font-size:12.5px}
  .buscador{padding:10px 16px;gap:9px}
  .campo input{padding:11px 18px;font-size:14.5px}
  /* Una fila que se desliza, no tres que se apilan. Las categorías se ven
     todas igual —no hay ninguna escondida detrás de un "ver más"— pero
     ocupan el alto de una sola. */
  .controles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .controles::-webkit-scrollbar{display:none}
  .filtros{flex-wrap:nowrap}
  .filtro,.cerca{flex:0 0 auto;white-space:nowrap}
  /* El mapa mide 46vh: en un celular de 640 px de alto son 294 px. Un globo
     de Leaflet sin tope se lleva ~300 px de ancho y unos 90 de alto, o sea
     casi todo el mapa, y tapa justamente las otras chinchetas que uno está
     comparando. Acá no se abre ninguno (ver `seleccionar`), pero el tope de
     ancho queda igual para el globo de "Estás acá" y para cualquiera que
     se abra por otro camino. */
  .leaflet-popup-content-wrapper{max-width:78vw}
  .leaflet-popup-content{font-size:12.5px}

  /* En celular la tarjeta seleccionada es la que REEMPLAZA al globo: si no se
     distingue del resto, tocar una chincheta no parece haber hecho nada. El
     riel cian es la misma señal que el aro de la chincheta, del otro lado. */
  .ficha[aria-current="true"]{box-shadow:inset 3px 0 0 var(--cian)}
  .ficha h3{font-size:16.5px}
  .resena{font-size:15px;line-height:1.62}
  .esp{font-size:13.5px}
  .dir{font-size:13px}
  /* El texto largo se cortaba en "pediatra, n" en un teléfono angosto, que es
     peor que no sugerir nada: parece un error de la página. */
  #q::placeholder{font-size:13.5px}
}
@media(max-width:430px){
  .ficha-cuerpo{grid-template-columns:38px 1fr;gap:11px;padding:15px 16px 10px}
  .avatar{width:38px;height:38px;font-size:15px;border-radius:10px}
  .acciones{padding:0 16px 15px 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="aviso">

    <span class="sr-only" hidden>Buscar</span>

  </label>
  <!-- "Cerca de mí" va JUNTO a los filtros y no adentro: no filtra, ORDENA.
       Y no puede ir dentro de #filtros porque pintarFiltros() reescribe ese
       innerHTML entero cada vez que se toca una categoría, y se lo llevaría
       puesto. -->
  <div class="controles">

  <div class="mapa-caja"><div id="mapa"></div></div>
</div>

    d:"Av. América, Queru Queru", lat:-17.3762, lng:-66.1451, reserva:false, h:[[1,"07:00","19:00"],[2,"07:00","19:00"],[3,"07:00","19:00"],[4,"07:00","19:00"],[5,"07:00","19:00"],[6,"07:00","19:00"]], tel:"59144002002" },
  { n:"Centro de Imágenes (ejemplo)", c:"imagenes", e:"Diagnóstico por imágenes",
    s:["Radiografía","Ecografía","Tomografía"],
    r:"Los estudios se suben directo a la ficha del médico que los pidió.",
    d:"Av. Oquendo, centro", lat:-17.3873, lng:-66.1512, reserva:false, h:[[1,"08:00","18:00"],[2,"08:00","18:00"],[3,"08:00","18:00"],[4,"08:00","18:00"],[5,"08:00","18:00"]], tel:"59144003001" },
  { n:"Farmacia (ejemplo)", c:"farmacia", e:"Farmacia",
    s:["Turno noche","Entrega a domicilio"],
    r:"Recibe la receta digital y prepara el pedido antes de que el paciente llegue.",
    d:"Plaza Colón", lat:-17.3846, lng:-66.1573, reserva:false, h:[[0,"08:00","22:00"],[1,"08:00","22:00"],[2,"08:00","22:00"],[3,"08:00","22:00"],[4,"08:00","22:00"],[5,"08:00","22:00"],[6,"08:00","22:00"]], tel:"59144004001" },
  { n:"Farmacia 24 horas (ejemplo)", c:"farmacia", e:"Farmacia",
    s:["Abierto 24 h","Turno noche"],
    r:"Atención las 24 horas, con la receta digital validada en el momento.",
    d:"Av. Ballivián, El Prado", lat:-17.3818, lng:-66.1604, reserva:false, h:[[0,"00:00","23:59"],[1,"00:00","23:59"],[2,"00:00","23:59"],[3,"00:00","23:59"],[4,"00:00","23:59"],[5,"00:00","23:59"],[6,"00:00","23:59"]], tel:"59144004002" },
];

// El signo va además del color: quien no distingue bien los colores —y es
// mucha gente— se queda sin ninguna pista de qué es cada cosa si el color es
// lo único que las separa.
var CATEGORIAS = {
  consultorio: { nombre: "Consultorios", color: "#19b9ef", signo: "\u2695" },
  laboratorio: { nombre: "Laboratorios", color: "#7BB98A", signo: "\u2697" },
  imagenes:    { nombre: "Imágenes",     color: "#B98AD3", signo: "\u25C9" },
  farmacia:    { nombre: "Farmacias",    color: "#D8A64B", signo: "\u271A" },
};

// ═══ LA BÚSQUEDA ══════════════════════════════════════════════════════════
//
// Busca en el nombre, la especialidad, las SUBESPECIALIDADES y la reseña.
//
// Las subespecialidades son las que resuelven el caso que importa: un
// pediatra que además es neonatólogo tiene que aparecer buscando "pediatra" y
// buscando "neonatólogo". Con un solo campo de especialidad eso no se puede,
// y es la razón por la que en la base hacen falta dos campos y no uno.
function normalizar(t) {
  return String(t || "").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "");  // sin tildes
}

// "pediatra", "pediatría" y "pediátrico" son la misma búsqueda para quien la
// escribe, así que se comparan por raíz y no letra por letra.
//
// La raíz se saca recortando SOLO la terminación de género y número. Un
// recorte más ambicioso —quitar "atra", "ologo", "ico"— deja muñones tan
// cortos que empiezan a coincidir con cualquier cosa: "pediatra" quedaba en
// "pedi" y encontraba una farmacia, por la palabra "pedido" de su reseña.
//
// Recortando poco, "pediatra" y "pediatría" caen las dos en "pediatr", que
// además está adentro de "odontopediatría" — o sea que un padre que busca
// "pediatra" también ve al odontopediatra, que es lo que querría.
function raiz(p) {
  return p.replace(/(ias|ia|os|as|es|o|a|s)$/, "");
}

// Se indexa por raíces y no por el texto crudo, para que la comparación sea
// entre cosas del mismo tipo a los dos lados.
function indice(lugar) {
  if (lugar._i) return lugar._i;
  lugar._i = normalizar([lugar.n, lugar.e, lugar.s.join(" "), lugar.r, lugar.d].join(" "))
    .split(/[^a-z0-9]+/).filter(Boolean).map(raiz).join(" ");
  return lugar._i;
}

function coincide(lugar, consulta) {
  if (!consulta) return true;
  var heno = indice(lugar);
  return normalizar(consulta).split(/\s+/).filter(Boolean).every(function (palabra) {
    return heno.indexOf(raiz(palabra)) > -1;
  });
}

// ═══ LA PANTALLA ══════════════════════════════════════════════════════════
var $ = function (id) { return document.getElementById(id); };
var estado = { q: "", cat: "todos", activo: null, aqui: null };
var marcadores = [];

var mapa = L.map("mapa", { scrollWheelZoom: true, zoomControl: true })
  .setView(String("__CENTRO__").split(",").map(Number), Number("__ZOOM__"));
// subdomains 'abcd': CARTO reparte por cuatro subdominios y Leaflet usa
// 'abc' por defecto, así que sin esto el cuarto nunca se pide y los otros
// tres cargan de más.
//
// La atribución NO es decorativa: es la condición de uso de los dos. Sacarla
// es lo que convierte un mapa gratis en un mapa bloqueado — que es
// exactamente lo que ya nos pasó con OpenStreetMap.
// subdomains "abcd": los proveedores que reparten por subdominios usan
// cuatro y Leaflet prueba con tres, así que el cuarto nunca se pediría. En
// los que no usan {s} —MapTiler— esta opción no molesta.
//
// tileSize y zoomOffset van del servidor porque dependen del proveedor: 256
// es lo clásico, 512 lo que sirven los modernos. Con 512 sin compensar el
// zoom, el mapa sale corrido un nivel y borroso, sin ningún error a la vista.
var tam = Number("__TAM_TEJA__") || 256;
L.tileLayer("__MOSAICOS__", {
  maxZoom: 19,
  subdomains: "abcd",
  tileSize: tam,
  zoomOffset: tam === 512 ? -1 : 0,
  attribution: __CREDITO__,
}).addTo(mapa);

// ─── ¿Está abierto AHORA? ──────────────────────────────────────────────────
//
// ═══ LA HORA ES LA DE BOLIVIA, NO LA DEL TELÉFONO ═════════════════════════
//
// Tentación: new Date().getHours(). Anda perfecto mientras quien mira está en
// Bolivia, y miente para todos los demás — el médico brasileño que abre el
// mapa desde São Paulo ve "cerrado" a las 9 de la mañana porque allá son las
// 10, y el familiar que consulta desde España ve cualquier cosa.
//
// Los consultorios están en Bolivia. Su horario es hora boliviana. Punto.
var DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

function ahoraEnBolivia() {
  var partes = new Intl.DateTimeFormat("en-GB", {
    timeZone: "America/La_Paz", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date());
  var v = {};
  partes.forEach(function (p) { v[p.type] = p.value; });
  var dia = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(v.weekday);
  return { dia: dia, minutos: Number(v.hour) * 60 + Number(v.minute) };
}

function aMinutos(hhmm) {
  var p = String(hhmm).split(":");
  return Number(p[0]) * 60 + Number(p[1]);
}

// Devuelve qué mostrar: si está abierto y hasta qué hora, o cuándo abre.
// Se mira hasta siete días adelante para contestar "abre el lunes" en vez de
// un "cerrado" a secas, que no le sirve a nadie un domingo a la noche.
function estadoHorario(franjas, ahora) {
  if (!franjas || !franjas.length) return null;
  for (var i = 0; i < franjas.length; i++) {
    var f = franjas[i];
    if (f[0] === ahora.dia && ahora.minutos >= aMinutos(f[1]) && ahora.minutos < aMinutos(f[2])) {
      return { abierto: true, texto: "Abierto · cierra " + f[2] };
    }
  }
  for (var d = 0; d < 8; d++) {
    var dia = (ahora.dia + d) % 7;
    var delDia = franjas.filter(function (f) { return f[0] === dia; })
      .sort(function (a, b) { return aMinutos(a[1]) - aMinutos(b[1]); });
    for (var j = 0; j < delDia.length; j++) {
      if (d > 0 || aMinutos(delDia[j][1]) > ahora.minutos) {
        var cuando = d === 0 ? "hoy" : d === 1 ? "mañana" : "el " + DIAS[dia];
        return { abierto: false, texto: "Cerrado · abre " + cuando + " " + delDia[j][1] };
      }
    }
  }
  return { abierto: false, texto: "Cerrado" };
}

// ─── ¿Cuál me queda cerca? ─────────────────────────────────────────────────
//
// Fórmula del semiverseno. Para distancias de ciudad, tratar la Tierra como
// una esfera se equivoca en metros: de sobra para ordenar una lista.
function distanciaKm(a, b, c, d) {
  var R = 6371, r = Math.PI / 180;
  var dLat = (c - a) * r, dLng = (d - b) * r;
  var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

// Abajo del kilómetro, en metros: "a 400 m" se entiende caminando, "a 0,4 km"
// hay que traducirlo mentalmente.
function formatearDistancia(km) {
  return km < 1 ? "a " + Math.round(km * 100) * 10 + " m"
                : "a " + km.toFixed(1).replace(".", ",") + " km";
}

// Abre la aplicación de mapas del teléfono con la ruta puesta. Un enlace y
// nada más: no hace falta ningún SDK, y funciona igual en Android, iPhone y
// computadora.
function comoLlegar(l) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + l.lat + "," + l.lng;
}

function chincheta(color, activa) {
  return L.divIcon({
    className: "",
    html: '<div class="chincheta' + (activa ? " activa" : "") + '" style="background:' + color + '"></div>',
    iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24],
  });
}

LUGARES.forEach(function (l, i) {
  var m = L.marker([l.lat, l.lng], { icon: chincheta(CATEGORIAS[l.c].color, false), title: l.n })
    // maxWidth: sin tope, Leaflet usa 300 px y el globo sale más ancho que
    // alto. autoPanPadding deja aire contra los bordes para que el globo no
    // quede pegado al marco del mapa ni debajo de la atribución.
    // Sin " (ejemplo)": la tarjeta ya lo saca del título y lo pone como
    // etiqueta aparte. Dejarlo acá hacía que el mismo lugar se llamara
    // distinto en el mapa y en la lista.
    .bindPopup("<b>" + l.n.replace(" (ejemplo)", "") + "</b><em>" + l.e + "</em><br>" + l.d,
      { maxWidth: 240, autoPanPadding: [16, 16] })
    .addTo(mapa);
  m.on("click", function () { seleccionar(i, false); });
  marcadores.push(m);
});

// ═══ EN CELULAR EL GLOBO NO ABRE ══════════════════════════════════════════
//
// El mapa tiene 46vh en celular. Un globo de Leaflet ahí adentro tapa las
// demás chinchetas —o sea, tapa exactamente lo que uno está mirando cuando
// compara consultorios— para decir el nombre, la especialidad y la dirección.
//
// Esas tres cosas ya están en la tarjeta de abajo, con el horario y la
// distancia además, y con tamaño de lectura. Así que en celular tocar una
// chincheta hace lo mismo que abrir el globo pero al revés: marca la
// chincheta y trae la tarjeta a la vista. El mapa queda entero.
//
// Se consulta en cada llamada y no una vez al cargar: girar el teléfono
// cambia la respuesta, y calcularlo al inicio deja la pantalla vertical
// comportándose como una horizontal hasta recargar.
function esAngosto() {
  return window.matchMedia("(max-width:860px)").matches;
}

function seleccionar(i, moverMapa) {
  estado.activo = i;
  marcadores.forEach(function (m, j) {
    m.setIcon(chincheta(CATEGORIAS[LUGARES[j].c].color, j === i));
  });
  if (moverMapa !== false) mapa.panTo([LUGARES[i].lat, LUGARES[i].lng]);

  var angosto = esAngosto();
  if (angosto) mapa.closePopup();
  else marcadores[i].openPopup();

  var elegida = null;
  [].slice.call($("fichas").children).forEach(function (f) {
    var esta = Number(f.getAttribute("data-i")) === i;
    f.setAttribute("aria-current", esta ? "true" : "false");
    if (esta) elegida = f;
  });

  // Solo cuando el clic vino del mapa (moverMapa === false): si vino de la
  // tarjeta, la tarjeta ya está donde el dedo la dejó y moverla de golpe es
  // desconcertante.
  //
  // Va también en escritorio: con trece lugares la lista ya no entra entera,
  // y tocar una chincheta de las de abajo dejaba su tarjeta fuera de la
  // pantalla. block:"nearest" mueve lo mínimo, así que si ya se ve no hace
  // nada.
  //
  // En celular va "start" y no "nearest": la tarjeta mide unos 300 px y la
  // lista, aun después de agrandarla, unos 250. "nearest" mueve lo mínimo, y
  // lo mínimo es dejar el nombre del consultorio fuera de la pantalla por
  // arriba —justo lo que dice qué estás mirando—. "start" lo pone primero.
  if (elegida && moverMapa === false) {
    elegida.scrollIntoView({ block: angosto ? "start" : "nearest", behavior: "smooth" });
  }
}

function pintarFiltros() {
  var cajas = [["todos", "Todos"]].concat(Object.keys(CATEGORIAS).map(function (k) {
    return [k, CATEGORIAS[k].nombre];
  }));
  $("filtros").innerHTML = cajas.map(function (c) {
    return '<button class="filtro" type="button" data-c="' + c[0] + '" aria-pressed="' +
      (c[0] === estado.cat ? "true" : "false") + '">' + c[1] + "</button>";
  }).join("");
  [].slice.call($("filtros").children).forEach(function (b) {
    b.addEventListener("click", function () {
      estado.cat = b.getAttribute("data-c");
      pintarFiltros(); pintar();
    });
  });
}

function pintar() {
  var visibles = [];
  LUGARES.forEach(function (l, i) {
    var ok = (estado.cat === "todos" || l.c === estado.cat) && coincide(l, estado.q);
    // El marcador se saca del mapa cuando no corresponde: dejarlo visible
    // mientras la lista lo filtró haría que el mapa y la lista digan cosas
    // distintas al mismo tiempo.
    if (ok) { if (!mapa.hasLayer(marcadores[i])) marcadores[i].addTo(mapa); visibles.push(i); }
    else if (mapa.hasLayer(marcadores[i])) mapa.removeLayer(marcadores[i]);
  });

  // ═══ EL ORDEN ES LA MITAD DE LA UTILIDAD ════════════════════════════════
  //
  // Sin esto la lista sale en el orden en que están escritos los lugares. Con
  // trece ejemplos no se nota; con doscientos médicos de verdad el primero de
  // la lista es el que se dio de alta primero, que no le sirve a nadie.
  if (estado.aqui) {
    visibles.sort(function (a, b) {
      return distanciaKm(estado.aqui.lat, estado.aqui.lng, LUGARES[a].lat, LUGARES[a].lng) -
             distanciaKm(estado.aqui.lat, estado.aqui.lng, LUGARES[b].lat, LUGARES[b].lng);
    });
  }

  $("cuenta").textContent = visibles.length === 0 ? "" :
    visibles.length + (visibles.length === 1 ? " lugar" : " lugares") +
    (estado.aqui ? " · del más cercano" : "");

  if (!visibles.length) {
    $("fichas").innerHTML = '<p class="vacio">No encontramos nada con eso.<br>Probá con «pediatra», «laboratorio» o «farmacia».</p>';
    return;
  }

  // La tarjeta dejó de ser un <button> entero: ahora es un <article> con el
  // cuerpo clicable adentro y las acciones aparte. No es capricho de
  // marcado — un <a> o un <button> dentro de otro <button> es HTML inválido,
  // y los navegadores lo resuelven cada uno a su manera: el enlace de llamar
  // puede no funcionar, o funcionar y además seleccionar la tarjeta.
  var ahora = ahoraEnBolivia();
  $("fichas").innerHTML = visibles.map(function (i) {
    var l = LUGARES[i], cat = CATEGORIAS[l.c];
    var h = estadoHorario(l.h, ahora);
    var chips = "";
    if (h) chips += '<span class="chip ' + (h.abierto ? "abre" : "cierra") + '">' + h.texto + "</span>";
    if (estado.aqui) {
      chips += '<span class="chip dist">' +
        formatearDistancia(distanciaKm(estado.aqui.lat, estado.aqui.lng, l.lat, l.lng)) + "</span>";
    }
    return '<article class="ficha" data-i="' + i + '" aria-current="false">' +
      '<button class="ficha-cuerpo" type="button" data-i="' + i + '">' +
        '<span class="avatar" style="background:' + cat.color + '" aria-hidden="true">' + cat.signo + "</span>" +
        "<span>" +
          "<h3>" + l.n.replace(" (ejemplo)", "") + '<span class="ejemplo">EJEMPLO</span></h3>' +
          '<div class="esp">' + l.e + "</div>" +
          (chips ? '<div class="chips">' + chips + "</div>" : "") +
          '<p class="resena">' + l.r + "</p>" +
          '<div class="subs">' + l.s.map(function (s) { return '<span class="sub">' + s + "</span>"; }).join("") + "</div>" +
          '<div class="dir">' + l.d + "</div>" +
        "</span>" +
      "</button>" +
      '<div class="acciones">' +
        (l.reserva ? '<span class="reservar">Reservar ficha</span>' : "") +
        // tel: marca solo en el celular. Mucha gente —sobre todo la mayor,
        // que es la que más consulta— no reserva por internet: llama.
        '<a class="accion" href="tel:+' + l.tel + '">✆ Llamar</a>' +
        // Abre la aplicación de mapas con la ruta. "Av. Pando, Cala Cala" no
        // lleva a ningún lado si no conocés la zona.
        '<a class="accion" href="' + comoLlegar(l) + '" target="_blank" rel="noopener">➤ Cómo llegar</a>' +
      "</div>" +
      "</article>";
  }).join("");

  [].slice.call($("fichas").querySelectorAll(".ficha-cuerpo")).forEach(function (f) {
    f.addEventListener("click", function () { seleccionar(Number(f.getAttribute("data-i"))); });
  });
}

var espera = null;
// ─── Cerca de mí ───────────────────────────────────────────────────────────
//
// El navegador pide permiso solo; no hay nada que instalar ni ninguna clave.
// Lo que sí hay que hacer bien es lo que pasa cuando dice que NO —que va a
// pasar seguido— y cuando tarda: sin eso, el visitante toca el botón, no ve
// cambiar nada, y se queda pensando si anda o no.
var miMarca = null;
$("cerca").addEventListener("click", function () {
  var b = $("cerca");
  if (!navigator.geolocation) {
    b.textContent = "Tu navegador no sabe dónde estás";
    b.disabled = true;
    return;
  }
  b.textContent = "Buscando…";
  b.disabled = true;
  navigator.geolocation.getCurrentPosition(function (pos) {
    estado.aqui = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    b.textContent = "◎ Ordenado por cercanía";
    b.setAttribute("aria-pressed", "true");
    b.disabled = false;

    // Un punto propio, distinto de las chinchetas: quien mira tiene que
    // poder ubicarse SIN confundirse con un consultorio.
    if (miMarca) mapa.removeLayer(miMarca);
    miMarca = L.circleMarker([estado.aqui.lat, estado.aqui.lng], {
      radius: 7, color: "#e9f6fc", weight: 3, fillColor: "#19b9ef", fillOpacity: 1,
    }).addTo(mapa).bindPopup("Estás acá");
    mapa.setView([estado.aqui.lat, estado.aqui.lng], 14);
    pintar();
  }, function (err) {
    // El motivo importa: "lo bloqueaste" se arregla en el candado del
    // navegador, "no se pudo" se arregla intentando de nuevo. Decir
    // "no se pudo" en los dos casos deja a la mitad de la gente esperando.
    b.textContent = err.code === 1 ? "Permiso denegado" : "No se pudo ubicarte";
    b.disabled = err.code === 1;
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
});

$("q").addEventListener("input", function () {
  clearTimeout(espera);
  espera = setTimeout(function () { estado.q = $("q").value; pintar(); }, 120);
});

pintarFiltros();
pintar();
</script>
</body>
</html>
