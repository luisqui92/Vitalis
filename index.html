<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitalis · Kardex inteligente</title>
<link rel="icon" href="/logo.png">
<!-- Manifest + apple-touch-icon: en iPhone las notificaciones del navegador
     solo funcionan si el médico agregó Vitalis a la pantalla de inicio, y
     para eso hace falta esto. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vitalis">
<meta name="theme-color" content="#0f1720">
<link rel="preload" href="/fonts/fraunces-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/estilos.css">
<!-- Solo para los addons de Three.js (GLTFLoader/OrbitControls importan
     "three" así) — el módulo en sí (odontograma3d.js) se carga bajo demanda,
     recién cuando el odontólogo abre la vista 3D, nunca de arranque. -->
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js" } }
</script>
</head>
<body>

<div class="header no-imprimir" id="headerMobile">
  <div class="brand">
    <img src="/logo.png" alt="Vitalis" class="logo">
    <div>
      <h1>Vitalis</h1>
      <p id="headerSub">Kardex inteligente</p>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="btnAsistente" class="btn-ayuda" style="display:none" title="Preguntale a Vitalis" aria-label="Preguntale a Vitalis">?</button>
    <button id="btnLogout" style="display:none">Salir</button>
  </div>
</div>

<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>Cargando...</div>
</div>

<div class="footer no-imprimir">Vitalis SmartKardex</div>

<!-- Vista de escritorio (≥1024px, solo con sesión activa): sidebar fijo +
     barra superior, el contenido de cada pantalla se pinta en
     #escritorioContent. Arrancado/apagado por escritorio.js — oculto por
     defecto para que el celular jamás la vea ni pague su costo de layout. -->
<div class="escr-shell no-imprimir" id="escritorioShell" style="display:none">
  <aside class="escr-sidebar">
    <div class="escr-marca">
      <img src="/logo.png" alt="Vitalis" class="escr-logo">
      <span id="escrMarcaTexto">Vitalis</span>
    </div>
    <nav class="escr-nav" id="escrNav"></nav>
    <button class="escr-salir" id="escrBtnLogout">⏻ Salir</button>
  </aside>
  <div class="escr-main">
    <div class="escr-topbar">
      <div class="escr-topbar-titulo" id="escrTituloPantalla">Inicio</div>
      <div class="escr-topbar-usuario" id="escrUsuario"></div>
    </div>
    <div class="escr-content" id="escritorioContent"></div>
  </div>
</div>

<!-- Módulos, en orden de dependencia (todo comparte el mismo scope global,
     sin build step). main.js va último porque es el único que ejecuta código
     al cargar. -->
<!-- i18n va primero de todo: estado.js y el resto ya llaman a t() al
     definirse, y los diccionarios tienen que estar cargados para entonces. -->
<script src="/js/i18n.js"></script>
<script src="/i18n/es.js"></script>
<script src="/i18n/pt.js"></script>
<script src="/js/estado.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/personas.js"></script>
<script src="/js/pacientes.js"></script>
<script src="/js/odontograma.js"></script>
<script src="/js/examenOcular.js"></script>
<script src="/js/mapaGineco.js"></script>
<script src="/js/mapaCorporal.js"></script>
<script src="/js/embarazo.js"></script>
<script src="/js/crecimientoDatos.js"></script>
<script src="/js/crecimiento.js"></script>
<script src="/js/neurodesarrollo.js"></script>
<script src="/js/instrumentos.js"></script>
<script src="/js/tratamientos.js"></script>
<script src="/js/asistente.js"></script>
<script src="/js/notificaciones.js"></script>
<script src="/js/saldo.js"></script>
<script src="/js/recarga.js"></script>
<script src="/js/operador.js"></script>
<script src="/js/seguridad.js"></script>
<script src="/js/recordatorios.js"></script>
<script src="/js/agenda.js"></script>
<script src="/js/memoriaClinica.js"></script>
<script src="/js/mediciones.js"></script>
<script src="/js/mapaFacial.js"></script>
<script src="/js/simuladorFacial.js"></script>
<script src="/js/simulador25d.js"></script>
<script src="/js/vitalisFace.js"></script>
<script src="/js/rayos.js"></script>
<script src="/js/bandejaDicom.js"></script>
<script src="/js/visorImagen.js"></script>
<script src="/js/estudios.js"></script>
<script src="/js/informes.js"></script>
<script src="/js/informePublico.js"></script>
<script src="/js/webrtc.js"></script>
<script src="/js/teleconsulta.js"></script>
<script src="/js/grabacionTele.js"></script>
<script src="/js/teleconsultaMedico.js"></script>
<script src="/js/memed.js"></script>
<script src="/js/recetas.js"></script>
<script src="/js/consultas.js"></script>
<script src="/js/vinculacion.js"></script>
<script src="/js/escritorioExtra.js"></script>
<script src="/js/clinica.js"></script>
<script src="/js/escritorio.js"></script>
<script src="/js/realtime.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
