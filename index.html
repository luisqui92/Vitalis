<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitalis · Kardex inteligente</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/estilos.css">
<!-- Solo para los addons de Three.js (GLTFLoader/OrbitControls importan
     "three" así) — el módulo en sí (odontograma3d.js) se carga bajo demanda,
     recién cuando el odontólogo abre la vista 3D, nunca de arranque. -->
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js" } }
</script>
</head>
<body>

<div class="header no-imprimir">
  <div class="brand">
    <img src="/logo.png" alt="Vitalis" class="logo">
    <div>
      <h1>Vitalis</h1>
      <p id="headerSub">Kardex inteligente</p>
    </div>
  </div>
  <button id="btnLogout" style="display:none">Salir</button>
</div>

<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>Cargando...</div>
</div>

<div class="footer no-imprimir">Vitalis SmartKardex</div>

<!-- Módulos, en orden de dependencia (todo comparte el mismo scope global,
     sin build step). main.js va último porque es el único que ejecuta código
     al cargar. -->
<script src="/js/estado.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/pacientes.js"></script>
<script src="/js/odontograma.js"></script>
<script src="/js/tratamientos.js"></script>
<script src="/js/seguridad.js"></script>
<script src="/js/recordatorios.js"></script>
<script src="/js/agenda.js"></script>
<script src="/js/memoriaClinica.js"></script>
<script src="/js/mediciones.js"></script>
<script src="/js/estudios.js"></script>
<script src="/js/recetas.js"></script>
<script src="/js/consultas.js"></script>
<script src="/js/vinculacion.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
